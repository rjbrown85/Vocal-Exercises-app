<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FCEDA3"><meta name="description" content="Your voice. A piano. Room to practise. 56 original vocal exercises."><title>Vocal Exercises — vocal practice</title><link rel="stylesheet" href="style.css?v=pages-1"><link rel="stylesheet" href="glass.css?v=pages-1"><link rel="stylesheet" href="pages.css?v=1"><script src="theme.js?v=dark-1"></script></head>
<body><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div><main>
<header><div class="mast"><h1>Vocal Exercises</h1></div><button id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">☾ Dark</button></header>
<section id="home"><nav class="banks" aria-label="Exercise bank"><button data-bank="fundamentals" aria-pressed="true"><b>Fundamentals</b></button><button data-bank="blues" aria-pressed="false"><b>Blues Licks</b></button><button data-bank="rnb" aria-pressed="false"><b>R&amp;B</b></button><button data-bank="jazz" aria-pressed="false"><b>Jazz Licks</b></button><button data-bank="pop" aria-pressed="false"><b>Pop Licks</b></button><button data-bank="agility" aria-pressed="false"><b>Agility</b></button></nav></section><section id="practice" hidden aria-labelledby="category-title"><div class="practice-heading"><button id="back" type="button" aria-label="Back to categories">← Back</button><h2 id="category-title" tabindex="-1">Fundamentals</h2></div>
<div class="workspace"><section class="player panel" aria-label="Exercise player"><label class="sr" for="exercise">Exercise</label><select id="exercise"></select>
<div class="visual"><div class="pitch"><span id="keyLabel">C major</span><strong id="pitchLabel">C3</strong></div><svg id="contour" viewBox="0 0 520 110" role="img" aria-label="Exercise melody contour"></svg><div class="visual-bottom"><span id="phase" class="sr" role="status"></span><span id="progress">1 / 1</span></div></div>
<div id="keyboard" class="keyboard" aria-label="Playable piano"></div>
<div class="transport"><button id="play" class="play">▶ PLAY</button><button id="hold" class="text-button" aria-pressed="false">○ Hold key</button></div><p id="message" class="message" role="alert"></p></section>
<aside class="controls panel" aria-label="Practice settings"><label class="section-label">Range</label><div class="seg presets"><button data-preset="baritone">Baritone</button><button data-preset="tenor">Tenor</button><button data-preset="custom">Custom</button></div><div class="range-notes"><div><span>Low</span><div class="stepper"><button data-range="low" data-step="-1" aria-label="Lower low note">−</button><button id="low" aria-label="Hear low note">G2</button><button data-range="low" data-step="1" aria-label="Raise low note">+</button></div></div><div><span>High</span><div class="stepper"><button data-range="high" data-step="-1" aria-label="Lower high note">−</button><button id="high" aria-label="Hear high note">C5</button><button data-range="high" data-step="1" aria-label="Raise high note">+</button></div></div></div>

<div class="tempo-heading"><label class="section-label" for="tempo">Tempo</label><button id="metronome" class="text-button" aria-pressed="false">○ Metronome</button><output id="tempoValue">80 <small>BPM</small></output></div><input id="tempo" aria-label="Tempo" type="range" min="40" max="160" step="1" value="80">
<div class="volume-control"><label for="volume">Volume <output id="volumeValue">65%</output></label><input id="volume" aria-label="Volume" type="range" min="0" max="150" value="65"></div><details id="more"><summary>More options <span>+</span></summary><div class="fine"><div class="direction-option"><span class="section-label" id="direction-label">Key direction</span><div class="seg directions" role="group" aria-labelledby="direction-label"><button data-direction="back">↑↓ Up &amp; Down</button><button data-direction="up">↑ Up</button><button data-direction="down">↓ Down</button></div></div><label for="rhythm">Rhythm<select id="rhythm"><option value="original">Original</option><option value="even">Even</option></select></label><label for="playback">Playback<select id="playback"><option value="together">Sing together</option><option value="echo">Listen & echo</option></select></label><label for="scale">Scale<select id="scale"><option value="auto">Exercise default</option><option value="major">Major</option><option value="minor">Natural minor</option></select></label><label for="start">Starting key<select id="start"><option value="auto">Auto</option></select></label><label for="repeats">Repeats per key<select id="repeats"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label for="gap">Breathing gap<select id="gap"><option value="0">No extra gap</option><option value="1">1 beat</option><option value="2">2 beats</option><option value="4">4 beats</option><option value="6">6 beats</option></select></label><a class="sound-credit" href="credits.html" target="_blank" rel="noopener">Piano credits ↗</a></div></details></aside></div></section>


<script src="music.js?v=pages-1"></script><script src="piano.js?v=2"></script><script src="app.js?v=pages-1"></script><script src="tempo.js?v=1"></script><script src="menus.js?v=2"></script></main></body></html>
